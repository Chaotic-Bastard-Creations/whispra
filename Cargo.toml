[package]
name = "whispra"
version = "0.1.0"
edition = "2021"
autobins = false

[[bin]]
name = "whispra-server"
path = "src/bin/whispra-server.rs"

[[bin]]
name = "whispra-bridge"
path = "src/bin/whispra-bridge.rs"

[dependencies]
axum = { version = "0.8.4", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1.0.102"
aes-gcm = "0.10.3"
serde_json = "1.0.149"
randomizer = "0.1.2"
rand = "0.10.1"
dashmap = "6.2.1"
futures-util = "0.3.32"
serde = { version = "1.0", features = ["derive"] }
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
hex = "0.4.3"
snow = "0.9"
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
zeroize = { version = "1", features = ["derive"] }
thiserror = "1"
tower-http = { version = "0.6", features = ["cors"] }
clap = { version = "4", features = ["derive"] }
